name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - run: python3 scripts/check_jar.py
      - run: python3 scripts/generate_dashboards.py && git diff --exit-code monitoring/dashboards
      - run: docker compose -f monitoring/compose.yaml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: gregfana
          path: build/libs/*.jar
      # Rolling release so servers can fetch the main build without a token:
      # https://github.com/<owner>/<repo>/releases/download/latest/gregfana.jar
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/gregfana-*[0-9].jar gregfana.jar
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest main build" --notes "Rolling build of main."
          git tag -f latest && git push -f origin latest
          gh release upload latest gregfana.jar --clobber
