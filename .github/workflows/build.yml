name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - run: python3 scripts/check_jar.py
      - run: python3 scripts/generate_dashboards.py && git diff --exit-code monitoring/dashboards
      - run: docker compose -f monitoring/compose.yaml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: gregfana
          path: build/libs/*.jar
