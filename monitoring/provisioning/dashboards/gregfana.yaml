apiVersion: 1
providers:
  - name: Gregfana
    orgId: 1
    folder: Gregfana
    type: file
    disableDeletion: false
    # Edit in Grafana, then run scripts/pull_dashboards.py and commit. A file change overwrites UI edits.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
